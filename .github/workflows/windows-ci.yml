name: Windows diesel/turbo CI

on:
  push:
    branches: [ main, ci-bootstrap ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout enhancement overlay
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce failure-loop guard
        shell: powershell
        run: |
          python .ci/guard_failure_loops.py .
          if ($LASTEXITCODE -ne 0) { throw "failure-loop guard rejected repository state" }

      - name: Recover retired generic V1 as readable text only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ref = 'e4fd0476f02ddcc22e40394f6b68501f8dc553f5'
          New-Item -ItemType Directory -Force '_ci/recovery' | Out-Null
          $parts = @()
          foreach ($n in 0..3) {
            $path = ".ci/generic_v1.part{0:D2}.b64" -f $n
            $spec = $ref + ':' + $path
            $parts += (git show $spec).Trim()
          }
          $bytes = [Convert]::FromBase64String(($parts -join ''))
          [IO.File]::WriteAllBytes('_ci/recovery/generic_v1_core.patch.gz', $bytes)
          $input = [IO.File]::OpenRead('_ci/recovery/generic_v1_core.patch.gz')
          $gzip = New-Object IO.Compression.GZipStream($input, [IO.Compression.CompressionMode]::Decompress)
          $output = [IO.File]::Create('_ci/recovery/generic_v1_core.patch')
          $gzip.CopyTo($output)
          $output.Dispose(); $gzip.Dispose(); $input.Dispose()
          $text = [IO.File]::ReadAllText('_ci/recovery/generic_v1_core.patch')
          if ($text.Length -lt 1000) { throw 'Recovered readable generic V1 patch is unexpectedly small' }
          Write-Host "Recovered readable generic V1 patch: $($text.Length) characters"

      - name: Upload readable generic V1 recovery
        uses: actions/upload-artifact@v4
        with:
          name: generic-v1-readable-recovery
          path: _ci/recovery/generic_v1_core.patch
          if-no-files-found: error

      - name: Restore deterministic CI seed
        shell: powershell
        run: |
          $parts = 1..5 | ForEach-Object { ".ci/seed.part{0:D2}.b64" -f $_ }
          $b64 = ($parts | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\seed.zip", [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash "$env:RUNNER_TEMP\seed.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '47d987cfeb1f90b53fa203eda2a1a669cd660b5838a9c49b83389d1c1ba8fd23') { throw "CI seed SHA256 mismatch: $hash" }
          Expand-Archive -Force "$env:RUNNER_TEMP\seed.zip" "$env:RUNNER_TEMP\seed"
          Copy-Item -Recurse -Force "$env:RUNNER_TEMP\seed\engine-sim-diesel-ci-seed\*" "$env:GITHUB_WORKSPACE"
          Copy-Item -Force "$env:RUNNER_TEMP\seed\engine-sim-diesel-ci-seed\.gitignore" "$env:GITHUB_WORKSPACE\.gitignore"
          python .ci/diagnostic_patch.py
          if ($LASTEXITCODE -ne 0) { throw "diagnostic patch failed" }

      - name: Snapshot reconstructed overlay
        shell: powershell
        run: |
          Compress-Archive -Path assets,include,src,test,tools -DestinationPath "$env:RUNNER_TEMP\reconstructed-overlay.zip" -CompressionLevel Optimal

      - name: Upload reconstructed overlay
        uses: actions/upload-artifact@v4
        with:
          name: reconstructed-overlay
          path: ${{ runner.temp }}\reconstructed-overlay.zip
          if-no-files-found: error

      - name: Build, regression-compare, runtime-smoke, package
        id: ci
        shell: powershell
        run: .\tools\windows_ci.ps1

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-sim-test-evidence
          path: _ci/logs
          if-no-files-found: warn

      - name: Upload audited Windows runtime
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: engine-sim-diesel-windows-x64
          path: _ci/engine-sim-diesel-windows-x64.zip
          if-no-files-found: error
